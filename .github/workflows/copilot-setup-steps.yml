name: Copilot Setup Steps

on:
  workflow_dispatch:


jobs:
  # This job name is required by GitHub Copilot cloud agent.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: copilot
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      DEMO_USER_EMAIL: ${{ secrets.DEMO_USER_EMAIL }}
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
      EMPTY_USER_EMAIL: ${{ secrets.EMPTY_USER_EMAIL }}
      EMPTY_USER_PASSWORD: ${{ secrets.EMPTY_USER_PASSWORD }}
      NEW_USER_PASSWORD: ${{ secrets.NEW_USER_PASSWORD }}
    permissions:
      contents: read
    services:
      rolnopol:
        image: jaktestowac/rolnopol:latest
        ports:
          - 3000:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Wait for rolnopol service to be ready
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf "$BASE_URL" > /dev/null; then
              echo "Service is up"
              exit 0
            fi
            echo "Waiting for service..."
            sleep 2
          done
          echo "Service did not become ready in time" >&2
          exit 1

      - name: Export environment defaults for agent tasks
        run: |
          echo "BASE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"

      - name: Verify Playwright CLI availability
        run: npx playwright --version
